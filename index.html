<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NFT SIM</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    background: #0d0d0d;
    color: white;
    font-family: Arial;
    text-align: center;
}

.card {
    background: #1a1a1a;
    border-radius: 15px;
    padding: 15px;
    margin: 10px;
}

button {
    background: orange;
    border: none;
    padding: 10px;
    border-radius: 10px;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🟡 NFT SIM</h1>

<div class="card">
    <h2>🔥 Fire Gift</h2>
    <p>Common NFT</p>
    <button onclick="buy('Fire Gift')">Купить</button>
</div>

<div class="card">
    <h2>💎 Diamond Box</h2>
    <p>Rare NFT</p>
    <button onclick="buy('Diamond Box')">Купить</button>
</div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();

function buy(item) {
    alert("Куплено: " + item);
}
</script>

</body>
</html>
